# Desarrollo: código en caliente por bind-mount desde C: (antes en D:, corrupto).
services:
  api:
    command: ["node", "--watch", "src/server.js"]
    environment:
      NODE_ENV: development
    volumes:
      - ./api/src:/app/src
      - ./api/scripts:/app/scripts

  web:
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/admin:/usr/share/nginx/admin:ro
      - ./nginx/estudio:/usr/share/nginx/estudio:ro
