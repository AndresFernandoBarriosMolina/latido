# ============================================================================
#  Latido — nginx dev (reconstruido 2026-07-28). Sirve la PWA + consolas y
#  hace de reverse proxy a la API, Socket.io y MinIO. HTTP en :80 (host 8080).
# ============================================================================
server {
    listen 80;
    server_name _;
    client_max_body_size 600m;

    # CSP amplia para desarrollo (LiveKit hace fetch/ws a localhost:7880).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob:; media-src 'self' blob: http://localhost:8080; font-src 'self' https: data:; connect-src 'self' ws://localhost:* http://localhost:* wss:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    # ---- API REST (quita el prefijo /api) ----
    location /api/ {
        proxy_pass http://api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- WebSocket Socket.io ----
    location /socket.io/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ---- CDN: bucket público de MinIO (avatars/previews/covers) ----
    location /cdn/ {
        proxy_pass http://minio:9000/latido-public/;
        proxy_set_header Host $http_host;
    }

    # ---- URLs firmadas de MinIO (preserva host+puerto para SigV4) ----
    location ~ ^/(latido-media|latido-public)/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
    }

    # ---- Consola admin (web independiente) ----
    location /admin/ {
        alias /usr/share/nginx/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- Consola de creadora (web independiente) ----
    location /estudio/ {
        alias /usr/share/nginx/estudio/;
        try_files $uri $uri/ /estudio/index.html;
    }

    # ---- PWA (usuario) ----
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
