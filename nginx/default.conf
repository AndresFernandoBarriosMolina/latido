# ============================================================================
#  Latido — Reverse proxy: sirve la PWA y enruta API + WebSocket.
#  Incluye cabeceras de seguridad y endurecimiento contra hotlinking.
# ============================================================================

# Redirección a HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ---------- Cabeceras de seguridad globales ----------
    add_header X-Frame-Options "DENY" always;                 # anti-embebido/clickjacking
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # CSP: bloquea scripts externos; ayuda a frenar exfiltración de contenido
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' wss:; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'" always;

    client_max_body_size 200m;   # subida de videos por creadoras

    # ---------- Frontend (PWA estática) ----------
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ---------- API REST ----------
    location /api/ {
        proxy_pass http://api:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- WebSocket (Socket.io: presencia + señalización WebRTC) ----------
    location /socket.io/ {
        proxy_pass http://api:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # ---------- Entrega de media protegida ----------
    #  El contenido premium NUNCA se sirve estáticamente. Se pide a la API una
    #  URL firmada de corta vida; aquí solo se valida el referer como capa extra.
    location /media/ {
        valid_referers none blocked server_names;
        if ($invalid_referer) { return 403; }
        proxy_pass http://api:4000/media/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
