# ============================================================================
#  Latido — nginx de PRODUCCIÓN detrás del proxy de Coolify (Traefik).
#  Traefik termina el TLS y reenvía a este servicio en el puerto 80 (HTTP).
#  Por eso aquí NO hacemos SSL ni redirección 80→443 (lo hace Coolify).
# ============================================================================
server {
    listen 80;
    server_name _;
    client_max_body_size 600m;

    # Cabeceras de seguridad (el HSTS/SSL lo gestiona el proxy de Coolify).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob:; media-src 'self' blob: https:; font-src 'self' https: data:; connect-src 'self' https: wss:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    # ---------- API REST (quita el prefijo /api) ----------
    location /api/ {
        proxy_pass http://api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- WebSocket Socket.io ----------
    location /socket.io/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ---------- CDN: bucket público de MinIO (avatars/previews/covers) ----------
    location /cdn/ {
        proxy_pass http://minio:9000/latido-public/;
        proxy_set_header Host $http_host;
    }

    # ---------- URLs firmadas de MinIO (preserva host+puerto para SigV4) ----------
    location ~ ^/(latido-media|latido-public)/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
    }

    # ---------- Consola admin ----------
    location /admin/ {
        alias /usr/share/nginx/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---------- Consola de creadora ----------
    location /estudio/ {
        alias /usr/share/nginx/estudio/;
        try_files $uri $uri/ /estudio/index.html;
    }
    location /socio/ {
        alias /usr/share/nginx/socio/;
        try_files $uri $uri/ /socio/index.html;
    }

    # ---------- PWA (usuario) ----------
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
